version: 1
project:
  name: coze
  root: .
  languages: [python]
  commands:
    test: python -m pytest -q
    lint: ruff check .
    typecheck: mypy src
    format: ruff format .
  modules:
    - id: app
      path: .

style:
  profile: pep8-ruff

learning:
  enabled: true
  idle_minutes: 15
  budget:
    max_cost_usd_per_night: 2.0

permissions:
  mode: accept_edits

model:
  provider: openai-compatible
  name: deepseek-chat
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  max_turns: 24
  max_tool_calls: 40
  max_cost_usd: 5.0
  input_cost_per_1m: 0.0
  output_cost_per_1m: 0.0
