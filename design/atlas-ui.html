<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — interactive coding agent</title>
  <style>
    :root {
      --bg: #0b0c0f;
      --panel: #111318;
      --panel-2: #15181e;
      --panel-3: #191d23;
      --line: #23272f;
      --line-soft: #1a1d23;
      --text: #e7e9ee;
      --muted: #8b919c;
      --faint: #5b616c;
      --accent: #d97757;
      --accent-soft: #2a1b16;
      --green: #7ee787;
      --yellow: #d29922;
      --red: #f85149;
      --blue: #8ba4c7;
      --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    ::selection { background: rgba(217, 119, 87, .3); }

    .app {
      display: flex;
      width: 100%;
      max-width: 1680px;
      height: 100vh;
      margin: 0 auto;
      background: var(--bg);
    }

    /* ============================== sidebar ============================== */
    .sidebar {
      width: 262px;
      flex: 0 0 262px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #0c0e12;
      border-right: 1px solid var(--line-soft);
      z-index: 40;
    }

    .side-head {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: #f3f4f7;
      white-space: nowrap;
    }
    .brand-mark { color: var(--accent); font-size: 18px; line-height: 1; }
    .brand .tag {
      margin-left: 2px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .04em;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .icon-btn:hover { color: var(--text); background: var(--panel-2); border-color: var(--line); }
    .icon-btn.primary { color: var(--accent); }
    .side-head .icon-btn { margin-left: auto; }

    .side-search {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 2px 14px 10px;
      padding: 0 9px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #0f1115;
      color: var(--faint);
    }
    .side-search span { font-size: 14px; }
    .side-search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }
    .side-search input::placeholder { color: #4f5661; }
    .side-search kbd {
      border: 1px solid #282d36;
      border-radius: 4px;
      padding: 1px 4px;
      color: #4d535d;
      font-family: var(--mono);
      font-size: 9px;
    }

    .side-nav { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 32px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--panel-2); color: var(--text); }
    .nav-item.active { background: var(--panel-2); color: var(--text); }
    .nav-item .n-icon { width: 16px; color: var(--faint); font-family: var(--mono); }
    .nav-item.active .n-icon { color: var(--accent); }
    .nav-item .count {
      margin-left: auto;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
    }

    .side-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px 7px;
      color: #4d535d;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .side-label::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

    .session-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 8px 14px;
      scrollbar-width: thin;
      scrollbar-color: #2a2e36 transparent;
    }
    .session-group { margin-bottom: 5px; }
    .session-group-label {
      padding: 8px 10px 5px;
      color: #4d535d;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .08em;
    }
    .session-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 48px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
    }
    .session-row:hover { background: var(--panel-2); color: var(--text); }
    .session-row.active { background: #171a20; border-color: #272c35; color: var(--text); }
    .session-row.active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      border-radius: 2px;
      background: var(--accent);
    }
    .session-ico { width: 18px; flex: 0 0 18px; color: var(--faint); font-family: var(--mono); font-size: 12px; }
    .session-row.active .session-ico { color: var(--accent); }
    .session-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .session-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      color: inherit;
    }
    .session-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #4f5661;
      font-family: var(--mono);
      font-size: 9.5px;
    }
    .session-del {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #4f5661;
      cursor: pointer;
    }
    .session-row:hover .session-del { display: inline-flex; }
    .session-del:hover { color: var(--red); background: #241416; }

    .side-foot { flex: 0 0 auto; padding: 10px 12px 12px; border-top: 1px solid var(--line-soft); }
    .model-card {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #0f1115;
    }
    .model-card .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(126, 231, 135, .08); }
    .model-card div { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .model-card b { color: #d8dbe1; font-family: var(--mono); font-size: 10.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
    .model-card small { color: #4f5661; font-size: 9.5px; }

    /* ============================== main ============================== */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

    .topbar {
      height: 56px;
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px 0 22px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(11, 12, 15, .82);
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .crumb { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
    .crumb .proj { color: var(--muted); }
    .crumb #crumb-session { color: #c9cdd5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .pill {
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #0e1014;
      font-family: var(--mono);
      font-size: 10px;
    }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(126, 231, 135, .08); }
    .status.working i { background: var(--yellow); animation: pulse 1.1s ease-in-out infinite; }
    .status.stopped i { background: var(--red); }
    @keyframes pulse { 50% { opacity: .35; } }

    .content { flex: 1; min-height: 0; display: flex; }
    .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }

    .transcript {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 20px 18px;
      scrollbar-width: thin;
      scrollbar-color: #2a2e36 transparent;
      scroll-behavior: smooth;
    }
    .stream { width: min(840px, 100%); margin: 0 auto; }

    .day-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 18px;
      color: #4d535d;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .day-divider::before, .day-divider::after { content: ""; height: 1px; flex: 1; background: var(--line-soft); }
    .day-divider:first-child { margin-top: 0; }

    .message { margin-bottom: 24px; animation: fadeUp .22s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .msg-label {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 9px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .msg-label .name { color: var(--muted); letter-spacing: .02em; text-transform: none; }
    .msg-label .time { margin-left: auto; color: #454b55; letter-spacing: 0; }
    .assistant-label .brand-mark { font-size: 14px; }
    .msg-label .msg-status { color: #4f5661; font-size: 9px; letter-spacing: .04em; }
    .msg-label .msg-status.done { color: #5f9c68; }
    .msg-label .msg-status.running { color: var(--yellow); }
    .msg-label .msg-status.stopped { color: var(--red); }

    .user-bubble {
      position: relative;
      margin-left: 23px;
      padding: 11px 14px;
      border: 1px solid #272c35;
      border-radius: 10px;
      background: #14171d;
      color: #eef0f4;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user-bubble::before {
      content: "❯";
      position: absolute;
      left: -23px;
      top: 9px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 13px;
    }
    .attachments { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .attachment {
      padding: 2px 7px;
      border: 1px solid #2b3039;
      border-radius: 5px;
      background: #0e1014;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 10px;
    }

    .prose { padding-left: 23px; color: #c9cdd5; font-size: 14px; line-height: 1.78; }
    .prose p { margin: 0 0 12px; }
    .prose p:last-child { margin-bottom: 0; }
    .prose h2, .prose h3 { margin: 18px 0 8px; color: #f0f1f4; font-weight: 600; letter-spacing: -.01em; }
    .prose h2 { font-size: 15px; }
    .prose h3 { font-size: 13.5px; }
    .prose strong { color: #f0f1f4; font-weight: 600; }
    .prose em { color: #b8bec8; }
    .prose ul, .prose ol { margin: 8px 0 13px; padding-left: 21px; }
    .prose li { margin: 5px 0; }
    .prose blockquote { margin: 12px 0; padding: 2px 0 2px 12px; border-left: 2px solid #3a2a24; color: #9aa0aa; }
    .prose code, .inline-code {
      font-family: var(--mono);
      font-size: .9em;
      color: #e8c4b4;
      background: #1b1613;
      border: 1px solid #2a211c;
      padding: 1px 5px;
      border-radius: 4px;
      word-break: break-word;
    }
    .prose pre.code-block {
      margin: 12px 0;
      padding: 12px 14px;
      overflow-x: auto;
      background: #0b0c0f;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #aab1bc;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.65;
    }
    .prose pre.code-block code { padding: 0; border: 0; background: transparent; color: inherit; font-size: inherit; }
    .prose a { color: var(--blue); text-decoration: none; border-bottom: 1px dotted #445064; }

    .stream-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      margin-left: 2px;
      vertical-align: -2px;
      border-radius: 1px;
      background: var(--accent);
      animation: blink 1s steps(1, end) infinite;
    }
    @keyframes blink { 0%, 49% { opacity: .9; } 50%, 100% { opacity: 0; } }

    .thinking { display: flex; align-items: center; gap: 8px; padding-left: 23px; color: var(--muted); font-size: 13px; }
    .thinking .dots { display: inline-flex; gap: 3px; }
    .thinking .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: dot 1.2s ease-in-out infinite; }
    .thinking .dots i:nth-child(2) { animation-delay: .15s; }
    .thinking .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-2px); } }

    /* process bar + inline steps */
    .process-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: calc(100% - 23px);
      margin: 13px 0 0 23px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1115;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      text-align: left;
      cursor: pointer;
    }
    .process-bar:hover { border-color: #2b3039; background: var(--panel); }
    .process-bar .p-ico { color: var(--accent); }
    .process-bar .p-ico.spin { display: inline-block; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .process-bar .p-meta { color: #4f5661; }
    .process-bar .p-chev { margin-left: auto; color: #4f5661; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border: 1px solid #24402b;
      border-radius: 999px;
      background: #0e1a12;
      color: var(--green);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.5;
    }
    .status-pill.running { border-color: #3c3217; background: #1a150b; color: var(--yellow); }
    .status-pill.stopped { border-color: #3c1b1b; background: #1a0e0e; color: var(--red); }
    .status-pill.error { border-color: #3c1b1b; background: #1a0e0e; color: var(--red); }

    .inline-steps { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 0 23px; }
    .step-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border: 1px solid #242931;
      border-radius: 5px;
      background: #0e1014;
      color: #6f7681;
      font-family: var(--mono);
      font-size: 9.5px;
    }
    .step-chip.done { color: #7f9b85; border-color: #223328; }
    .step-chip.running { color: var(--yellow); border-color: #3a3018; }
    .step-chip.stopped { color: var(--red); border-color: #3a2020; }

    .msg-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 0 23px;
      color: #454b55;
      font-family: var(--mono);
      font-size: 9.5px;
    }
    .msg-foot .copy {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #4f5661;
      font-family: var(--mono);
      font-size: 9.5px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg-foot .copy:hover { color: var(--text); background: var(--panel-2); }

    .system-note {
      margin: 14px 0 22px;
      padding-left: 23px;
      color: #5f6671;
      font-family: var(--mono);
      font-size: 10.5px;
    }
    .system-note::before { content: "· "; color: var(--accent); }

    /* empty state */
    .empty { padding: 40px 23px 20px; }
    .empty .empty-mark { color: var(--accent); font-size: 30px; margin-bottom: 16px; }
    .empty h1 { margin: 0 0 8px; color: #f0f1f4; font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
    .empty p { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 520px; }
    .suggest-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .suggest {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #0f1115;
      color: var(--muted);
      text-align: left;
      font-size: 12px;
      line-height: 1.55;
      cursor: pointer;
    }
    .suggest:hover { border-color: #3a302b; background: #15181e; color: var(--text); }
    .suggest b { display: block; margin-bottom: 4px; color: #d8dbe1; font-size: 12.5px; font-weight: 500; }
    .suggest span { color: #5f6671; font-family: var(--mono); font-size: 9.5px; }

    /* composer */
    .composer-wrap {
      flex: 0 0 auto;
      position: relative;
      padding: 0 20px 10px;
      background: linear-gradient(to bottom, rgba(11, 12, 15, 0), var(--bg) 24%);
      z-index: 15;
    }
    .composer-inner { width: min(840px, 100%); margin: 0 auto; position: relative; }
    .suggestions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px 8px; }
    .suggestion-chip {
      border: 1px solid #242931;
      border-radius: 999px;
      background: #0f1115;
      color: #6f7681;
      padding: 4px 9px;
      font-family: var(--mono);
      font-size: 9.5px;
      cursor: pointer;
    }
    .suggestion-chip:hover { color: var(--text); border-color: #3a302b; }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      min-height: 54px;
      padding: 8px 9px 8px 14px;
      background: var(--panel);
      border: 1px solid #2b3039;
      border-radius: 12px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer:focus-within { border-color: #7a4a3b; box-shadow: 0 0 0 3px rgba(217, 119, 87, .08); }
    .composer.busy { border-color: #3a302b; }
    .prompt-sign { color: var(--accent); font-family: var(--mono); font-size: 15px; line-height: 1; padding-bottom: 12px; user-select: none; }
    #prompt {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      min-height: 38px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #eef0f4;
      font-size: 14px;
      line-height: 1.55;
      padding: 9px 0;
      overflow-y: auto;
    }
    #prompt::placeholder { color: #555c67; }
    .composer-actions { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; }
    .send-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3a302b;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      font-size: 16px;
      transition: opacity .15s ease, background .15s ease;
    }
    .send-btn:hover { background: #3a241c; }
    .send-btn:disabled { opacity: .3; cursor: default; }
    .stop-btn {
      height: 32px;
      padding: 0 9px;
      border: 1px solid #3c1b1b;
      border-radius: 8px;
      background: #1a0e0e;
      color: #f0a0a0;
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
    }
    .stop-btn:hover { background: #241214; }
    .composer-hints {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 3px 0;
      color: #4f5661;
      font-family: var(--mono);
      font-size: 9.5px;
      flex-wrap: wrap;
    }
    .composer-hints kbd { color: #8b919c; }
    .composer-hints .sep { color: #2b3039; }
    .attachment-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px 7px; }
    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 7px;
      border: 1px solid #2b3039;

      font-family: var(--mono);

    .attachment-chip button { border: 0; background: transparent; color: #4f5661; cursor: pointer; padding: 0; font-size: 11px; }
    .attachment-chip button:hover { color: var(--red); }

    /* palette */
    .palette {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% - 2px);
      z-index: 30;
      max-height: 320px;
      overflow-y: auto;
      background: #12151a;
      border: 1px solid #2b3039;
      border-radius: 11px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5);

    .palette-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-bottom: 1px solid var(--line-soft);
      color: #626974;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .palette-head kbd {
      margin-left: auto;
      color: #565d68;
      border: 1px solid #282d36;
      background: #0d0f13;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9px;
      text-transform: none;
    }
    .palette-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      cursor: pointer;
      border-left: 2px solid transparent;
    }
    .palette-item:hover, .palette-item.selected { background: #191d23; border-left-color: var(--accent); }
    .palette-icon { color: var(--accent); font-family: var(--mono); font-size: 12px; }
    .palette-name { color: #dfe2e8; font-family: var(--mono); font-size: 11.5px; }
    .palette-desc { color: #626974; font-size: 10px; margin-top: 2px; }
    .palette-key { color: #4d535d; font-family: var(--mono); font-size: 9px; }

    /* ============================== inspector ============================== */
    .inspector {
      width: 366px;
      flex: 0 0 366px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-left: 1px solid var(--line-soft);
      background: #0d0f13;
    }
    .inspector-head {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 17px 16px 8px;
    }
    .eyebrow { color: #4f5661; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .inspector-head h2 { margin: 4px 0 0; color: #e8eaee; font-size: 14px; font-weight: 550; letter-spacing: -.01em; }
    .inspector-head .icon-btn { margin-left: auto; }
    .tabs { display: flex; gap: 3px; padding: 0 12px; border-bottom: 1px solid var(--line-soft); }
    .tab {
      position: relative;
      padding: 8px 9px 9px;
      border: 0;
      background: transparent;
      color: #5f6671;
      font-size: 11.5px;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: #e8eaee; }
    .tab.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
    .inspector-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 24px; scrollbar-width: thin; scrollbar-color: #2a2e36 transparent; }

    .detail-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 13px; color: #4f5661; font-family: var(--mono); font-size: 9.5px; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .detail-stat { padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; background: #101318; }
    .detail-stat b { display: block; color: #d8dbe1; font-family: var(--mono); font-size: 12px; font-weight: 500; }
    .detail-stat span { color: #4f5661; font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: .06em; }

    .timeline { position: relative; }
    .detail-step { border-bottom: 1px solid var(--line-soft); }
    .detail-step:last-child { border-bottom: 0; }
    .detail-step summary {
      list-style: none;
      display: grid;
      grid-template-columns: 20px 18px minmax(0, 1fr) auto 12px;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 5px 2px;
      cursor: pointer;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
    }
    .detail-step summary::-webkit-details-marker { display: none; }
    .detail-step summary:hover { color: var(--text); }
    .step-index { color: #3f454f; font-size: 8.5px; }
    .step-icon { color: var(--accent); font-size: 12px; text-align: center; }
    .detail-step.running .step-icon { display: inline-block; animation: spin 1.1s linear infinite; }
    .step-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9cdd5; }
    .step-title code { color: #8ba4c7; background: transparent; border: 0; padding: 0; font-size: 9.5px; }
    .step-meta { color: #4f5661; font-size: 8.5px; white-space: nowrap; }
    .detail-step[open] > summary .step-icon { color: var(--accent); }
    .detail-step .chev { color: #3f454f; font-size: 9px; transition: transform .15s ease; }
    .detail-step[open] .chev { transform: rotate(90deg); }
    .step-content { padding: 0 2px 13px 45px; color: #9aa0aa; font-size: 11.5px; line-height: 1.7; }
    .step-content p { margin: 0 0 9px; }
    .step-content pre.output {
      margin: 8px 0 0;
      max-height: 230px;
      overflow: auto;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0a0b0e;
      color: #aab1bc;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .step-content .kv { display: flex; gap: 8px; margin: 4px 0; color: #6f7681; font-family: var(--mono); font-size: 9.5px; }
    .step-content .kv b { color: #9aa0aa; font-weight: 500; }
    .diff {
      margin: 8px 0 0;
      max-height: 230px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0a0b0e;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.6;
    }
    .diff div { padding: 1px 10px; white-space: pre-wrap; word-break: break-word; }

    .diff .del { color: #e08b8b; background: rgba(248, 81, 73, .08); }
    .diff .ctx { color: #6f7681; }

    .card { margin-top: 13px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: #101318; }
    .card h4 { margin: 0 0 8px; color: #8b919c; font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .card p { margin: 0; color: #9aa0aa; font-size: 11.5px; line-height: 1.7; }
    .file-list { display: flex; flex-direction: column; gap: 5px; }
    .file-row { display: flex; align-items: center; gap: 7px; color: #8ba4c7; font-family: var(--mono); font-size: 9.5px; }
    .file-row .file-ico { color: #4f5661; }
    .knowledge-card { margin-top: 8px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: #101318; }
    .knowledge-card .k-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .kind-pill { padding: 1px 5px; border: 1px solid #2b3039; border-radius: 4px; color: #8ba4c7; font-family: var(--mono); font-size: 8.5px; }
    .knowledge-card b { color: #d8dbe1; font-size: 11px; font-weight: 500; }
    .knowledge-card p { margin: 3px 0 6px; color: #8b919c; font-size: 10.5px; line-height: 1.6; }
    .knowledge-card .k-foot { display: flex; align-items: center; gap: 8px; color: #4f5661; font-family: var(--mono); font-size: 8.5px; }
    .knowledge-card .quote { margin-left: auto; border: 1px solid #2b3039; border-radius: 4px; background: transparent; color: #6f7681; font-family: var(--mono); font-size: 8.5px; padding: 2px 5px; cursor: pointer; }
    .knowledge-card .quote:hover { color: var(--text); border-color: #3a302b; }

    .empty-panel { padding: 28px 10px; color: #4f5661; text-align: center; font-size: 11.5px; line-height: 1.8; }
    .empty-panel .mark { display: block; margin-bottom: 8px; color: #2f343d; font-size: 22px; }

    /* ============================== status bar ============================== */
    .statusbar {
      height: 30px;
      flex: 0 0 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-top: 1px solid var(--line-soft);
      color: #454b55;
      font-family: var(--mono);
      font-size: 9px;
      white-space: nowrap;
    }
    .statusbar .sep { color: #2b3039; }
    .statusbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .context-meter { width: 48px; height: 3px; overflow: hidden; border-radius: 999px; background: #1e2229; }
    .context-meter span { display: block; width: 24%; height: 100%; background: var(--accent); transition: width .3s ease; }

    /* ============================== overlay / modal / toast ============================== */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(2px);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(3px);
    }
    .modal {
      width: min(560px, 100%);
      max-height: min(720px, 90vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #2b3039;
      border-radius: 14px;
      background: #101318;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
    }
    .modal-head { display: flex; align-items: flex-start; gap: 10px; padding: 17px 18px 10px; }
    .modal-head h2 { margin: 4px 0 0; font-size: 16px; font-weight: 550; color: #eef0f4; }
    .modal-head .icon-btn { margin-left: auto; }
    .modal-body { flex: 1; overflow-y: auto; padding: 4px 18px 16px; color: #9aa0aa; font-size: 12px; line-height: 1.7; }
    .modal-body h3 { margin: 16px 0 6px; color: #d8dbe1; font-size: 12px; font-weight: 550; }
    .modal-body p { margin: 0 0 9px; }
    .modal-body code { color: #e8c4b4; font-family: var(--mono); font-size: .92em; }
    .modal-body .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
    .modal-body .row:last-child { border-bottom: 0; }
    .modal-body .row span { color: #5f6671; }
    .modal-body .row b { color: #c9cdd5; font-weight: 500; }
    .modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line-soft); }
    .modal-foot .spacer { flex: 1; }
    .btn {
      padding: 6px 10px;
      border: 1px solid #2b3039;
      border-radius: 7px;
      background: #15181e;
      color: #b8bec8;
      font-size: 11px;
      cursor: pointer;
    }
    .btn:hover { color: var(--text); border-color: #3a302b; }
    .btn.primary { border-color: #6d4437; background: var(--accent-soft); color: #f0c0ad; }
    .btn.danger { border-color: #3c1b1b; background: #1a0e0e; color: #e08b8b; }
    .btn.danger:hover { background: #241214; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 54px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: min(520px, calc(100vw - 40px));
      padding: 8px 12px;
      border: 1px solid #2b3039;
      border-radius: 8px;
      background: #15181e;
      color: #c9cdd5;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
      font-family: var(--mono);
      font-size: 10.5px;
      transform: translateX(-50%) translateY(8px);
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .t-ico { color: var(--accent); }

    .jump-bottom {
      position: absolute;
      left: 50%;
      bottom: 108px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 5px 10px;
      border: 1px solid #2b3039;
      border-radius: 999px;
      background: #15181e;
      color: #8b919c;
      font-family: var(--mono);
      font-size: 9.5px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
    .jump-bottom:hover { color: var(--text); }

    .mobile-only { display: none; }

    /* ============================== responsive ============================== */
    @media (max-width: 1180px) {
      .inspector {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 45;
        width: min(390px, 94vw);
        transform: translateX(102%);
        transition: transform .2s ease;
        box-shadow: -20px 0 60px rgba(0, 0, 0, .35);
      }
      .inspector.open { transform: none; }
      #toggle-inspector { display: inline-flex; }
    }
    @media (min-width: 1181px) {
      #close-inspector, #toggle-inspector { display: none; }
    }
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 45;
        width: min(280px, 88vw);
        transform: translateX(-102%);
        transition: transform .2s ease;
        box-shadow: 20px 0 60px rgba(0, 0, 0, .35);
      }
      .sidebar.open { transform: none; }
      .mobile-only { display: inline-flex; }
      .topbar { padding-left: 10px; padding-right: 10px; }
      .crumb #crumb-session { max-width: 34vw; }
      .transcript { padding: 20px 12px 16px; }
      .composer-wrap { padding-left: 12px; padding-right: 12px; }
      .statusbar { padding: 0 12px; }
      .statusbar .cwd, .statusbar .hidden-mobile { display: none; }
      .suggest-grid { grid-template-columns: 1fr; }
      .empty { padding-top: 24px; }
      .msg-label .time { display: none; }
      .pill.model-pill { display: none; }
    }
    @media (max-width: 520px) {
      .top-actions .status span { display: none; }
      .composer-hints .optional { display: none; }
      .user-bubble { margin-left: 18px; }
      .prose, .thinking, .msg-foot { padding-left: 0; margin-left: 18px; }
      .process-bar, .inline-steps { margin-left: 18px; width: calc(100% - 18px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .transcript { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding:24px;color:#c9cdd5;font-family:sans-serif">
      Atlas UI 是一个交互原型，需要启用 JavaScript 才能发送消息和查看过程详情。
    </div>
  </noscript>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="会话历史">

        <div class="brand"><span class="brand-mark">✳</span><span>Atlas</span><span class="tag">LOCAL</span></div>

        <kbd>⌘K</kbd>
      </div>

      <nav class="side-nav" aria-label="主导航">

        <button class="nav-item" data-nav="knowledge"><span class="n-icon">◈</span>知识库<span class="count" id="knowledge-count">0</span></button>
        <button class="nav-item" data-nav="settings"><span class="n-icon">⚙</span>设置</button>
      </nav>

      <div class="side-label">最近</div>
      <div class="session-list" id="session-list"></div>

      <div class="side-foot">
        <div class="model-card">
          <span class="dot"></span>
          <div><b>deepseek-chat</b><small>OpenAI-compatible · demo</small></div>
          <button class="icon-btn" id="open-settings" title="设置" aria-label="设置">⋯</button>
        </div>
      </div>
    </aside>

    <main class="main">

      <div class="content">

          <div class="composer-wrap">
            <div class="composer-inner">
              <div class="palette" id="palette" hidden>
                <div class="palette-head"><span id="palette-title">Commands</span><kbd>esc</kbd></div>
                <div id="palette-items"></div>
              </div>

              <div class="suggestions" id="suggestions">
                <button class="suggestion-chip" data-suggest="解释这个项目的架构">解释项目架构</button>
                <button class="suggestion-chip" data-suggest="检查 TUI 的布局问题并修复">检查 TUI 布局</button>
                <button class="suggestion-chip" data-suggest="修复一个失败的测试">修复失败测试</button>
              </div>
              <div class="attachment-list" id="attachment-list"></div>
              <div class="composer" id="composer">
                <span class="prompt-sign">❯</span>

                <div class="composer-actions">
                  <button class="stop-btn" id="stop" hidden title="停止当前运行">■ 停止</button>

        <span class="right">
          <span class="hidden-mobile" id="session-stat">0 messages</span><span class="sep">/</span>

  </div>

  <div class="scrim" id="scrim" hidden></div>

        <div><span class="eyebrow" id="modal-eyebrow">ATLAS</span><h2 id="modal-title">设置</h2></div>

      <div class="modal-body" id="modal-body"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="t-ico">✓</span><span id="toast-text"></span></div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'atlas.ui.sessions.v3';
      const MAX_SESSIONS = 60;

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

      function uid(prefix) {
        return prefix + '_' + Math.random().toString(36).slice(2, 9);
      }

      function now() { return Date.now(); }

      function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
      }

      function formatTime(ts) {
        if (!ts) return '';
        const date = new Date(ts);
        return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function formatDuration(ms) {
        if (!ms || ms < 0) return '0ms';
        if (ms < 1000) return Math.round(ms) + 'ms';
        if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
        return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
      }

      function relativeTime(ts) {
        if (!ts) return '';
        const diff = now() - ts;
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
        if (diff < 172800000) return '昨天';
        if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
        return new Date(ts).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
      }

      function dayKey(ts) {
        const d = new Date(ts);
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      }

      function dayLabel(ts) {
        const today = dayKey(now());
        const yesterday = dayKey(now() - 86400000);
        const key = dayKey(ts);
        if (key === today) return '今天';
        if (key === yesterday) return '昨天';
        return new Date(ts).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });

      /* ------------------------------ markdown ------------------------------ */

      function inlineMarkdown(text) {
        let out = escapeHtml(text);
        out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
        out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        return out;
      }

      function renderTextBlocks(text) {
        const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
        let html = '';
        let paragraph = [];
        let list = null;

        const flushParagraph = () => {
          if (paragraph.length) {
            html += '<p>' + inlineMarkdown(paragraph.join(' ')) + '</p>';
            paragraph = [];
          }
        };
        const closeList = () => {
          if (list) {
            html += '</' + list + '>';
            list = null;
          }
        };

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) {
            flushParagraph();
            closeList();
            continue;
          }
          const heading = line.match(/^(#{2,3})\s+(.*)$/);
          if (heading) {
            flushParagraph();
            closeList();
            const level = heading[1].length;
            html += '<h' + level + '>' + inlineMarkdown(heading[2]) + '</h' + level + '>';
            continue;
          }
          const unordered = line.match(/^[-*]\s+(.*)$/);
          if (unordered) {
            flushParagraph();
            if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
            html += '<li>' + inlineMarkdown(unordered[1]) + '</li>';
            continue;
          }
          const ordered = line.match(/^\d+\.\s+(.*)$/);
          if (ordered) {
            flushParagraph();
            if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
            html += '<li>' + inlineMarkdown(ordered[1]) + '</li>';
            continue;
          }
          const quote = line.match(/^>\s+(.*)$/);
          if (quote) {
            flushParagraph();
            closeList();
            html += '<blockquote>' + inlineMarkdown(quote[1]) + '</blockquote>';
            continue;
          }
          closeList();
          paragraph.push(line);
        }
        flushParagraph();
        closeList();
        return html;
      }

        const segments = String(text).split('```');
        let html = '';
        segments.forEach((segment, index) => {
          if (index % 2 === 1) {
            const newline = segment.indexOf('\n');
            const code = newline >= 0 ? segment.slice(newline + 1) : segment;
            html += '<pre class="code-block"><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>';
          } else {
            html += renderTextBlocks(segment);
          }
        });
        return html;
      }
