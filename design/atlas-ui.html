            { kind: 'fact', title: 'TUI 使用 Textual', body: '主界面由 AtlasTUI、MessageLog 和 Collapsible 工具卡组成。', confidence: 0.94 },
            { kind: 'lesson', title: '回合进行中禁止切换会话', body: '否则流式回调会把内容写进新的 session 视图。', confidence: 0.86 }
          ]
        };
      }

      function genericScenario(prompt) {
        return {
          steps: [
            basePlan(prompt),
            step('search', 'search', '先在工作区收集与请求相关的上下文。', 'src/atlas/agent.py\nsrc/atlas/tools.py\nREADME.md', 150, { tool: 'search', arg: prompt.slice(0, 46) }),
            step('read', 'read', '读取最相关的实现文件。', '// 找到相关入口后，再决定是否需要修改\n// 所有写操作都经过 Workspace + AtlasTools 策略', 170, { tool: 'read', arg: 'src/atlas/agent.py' }),
            step('answer', '给出建议', '基于已收集的证据回答。', '', 200)
          ],
          answer: '我先按你的请求收集了工作区上下文，并定位到最相关的实现入口。\n\n' +
            '当前原型里建议按这个顺序推进：\n\n' +
            '1. 先确认目标文件和现有测试；\n' +
            '2. 用 `read`/`search` 补足上下文，再动 `edit`；\n' +
            '3. 最后用 `check` 记录验证证据。\n\n' +
            '你可以继续补充具体文件或失败输出，我会把步骤收窄到可执行的修改。',
          files: ['src/atlas/agent.py', 'src/atlas/tools.py'],
          knowledge: [
            { kind: 'fact', title: '先读后改', body: 'AtlasTools 会拒绝未读取文件的 edit。', confidence: 0.9 }
          ]
        };
      }

      function buildScenario(prompt, attachments) {
        const text = String(prompt || '');
        const lower = text.toLowerCase();
        let scenario;
        if (/(测试|pytest|test|失败|bug|修复|fix)/.test(lower)) scenario = testScenario();
        else if (/(tui|布局|界面|ui|layout)/.test(lower)) scenario = tuiScenario();
        else if (/(介绍|架构|项目|project|overview)/.test(lower)) scenario = projectScenario();
        else if (/(知识|memory|know|经验|lesson)/.test(lower)) scenario = knowledgeScenario(text);
        else scenario = genericScenario(text);

        if (attachments && attachments.length) {
          scenario.steps.splice(1, 0, step('read', 'read', '读取附件内容并纳入上下文。', 'attached: ' + attachments.join(', '), 160, {
            tool: 'read', arg: attachments.join(', ')
          }));
          scenario.files = Array.from(new Set((scenario.files || []).concat(attachments)));
        }
        return scenario;
      }

      /* ------------------------------ app ------------------------------ */

      class AtlasApp {
        constructor() {
          this.sessions = [];
          this.activeId = null;
          this.selectedMessageId = null;
          this.busy = false;
          this.runToken = 0;
          this.inspectorTab = 'process';
          this.attachments = [];
          this.paletteMode = null;
          this.paletteIndex = 0;
          this.paletteMatches = [];
          this.pinned = true;
          this.toastTimer = null;
          this.els = {
            sidebar: $('#sidebar'),
            sessionList: $('#session-list'),
            sessionSearch: $('#session-search'),
            sessionCount: $('#session-count'),
            knowledgeCount: $('#knowledge-count'),
            transcript: $('#transcript'),
            prompt: $('#prompt'),
            send: $('#send'),
            stop: $('#stop'),
            composer: $('#composer'),
            palette: $('#palette'),
            paletteTitle: $('#palette-title'),
            paletteItems: $('#palette-items'),
            suggestions: $('#suggestions'),
            attachmentList: $('#attachment-list'),
            inspector: $('#inspector'),
            inspectorBody: $('#inspector-body'),
            inspectorTitle: $('#inspector-title'),
            crumb: $('#crumb-session'),
            status: $('#run-status'),
            sessionStat: $('#session-stat'),
            contextMeter: $('#context-meter'),
            jump: $('#jump-bottom'),
            scrim: $('#scrim'),
            modal: $('#modal'),
            modalBody: $('#modal-body'),
            modalFoot: $('#modal-foot'),
            modalTitle: $('#modal-title'),
            modalEyebrow: $('#modal-eyebrow'),
            toast: $('#toast'),
            toastText: $('#toast-text')
          };
          this.init();
        }

        init() {
          this.load();
          if (!this.sessions.length) {
            this.sessions = seedSessions();
            this.activeId = this.sessions[0].id;
            this.selectedMessageId = this.lastAssistantId(this.activeSession());
            this.persist();
          }
          if (!this.activeId || !this.sessionById(this.activeId)) {
            this.activeId = this.sessions[0] && this.sessions[0].id;
          }
          if (!this.selectedMessageId) {
            this.selectedMessageId = this.lastAssistantId(this.activeSession());
          }
          this.bind();
          this.renderAll();
          this.setBusy(false);
          this.focusPrompt();
        }

        sessionById(id) {
          return this.sessions.find(session => session.id === id) || null;
        }

        activeSession() {
          return this.sessionById(this.activeId);
        }

        lastAssistantId(session) {
          if (!session) return null;
          for (let index = session.messages.length - 1; index >= 0; index -= 1) {
            if (session.messages[index].role === 'assistant') return session.messages[index].id;
          }
          return null;
        }

        selectedMessage() {
          const session = this.activeSession();
          if (!session) return null;
          return session.messages.find(message => message.id === this.selectedMessageId) || null;
        }

        load() {
          const raw = storage.read();
          if (!raw) return;
          try {
            const data = JSON.parse(raw);
            if (data && Array.isArray(data.sessions)) {
              this.sessions = data.sessions.filter(session => session && session.id && Array.isArray(session.messages));
              this.activeId = data.activeId || (this.sessions[0] && this.sessions[0].id);
            }
          } catch (error) {
            this.sessions = [];
          }
          // A page reload or crash during a simulated run leaves a running
          // assistant behind. Mark it stopped instead of showing a spinner
          // forever.
          this.sessions.forEach(session => {
            session.messages.forEach(message => {
              if (message.role !== 'assistant' || message.status !== 'running') return;
              message.status = 'stopped';
              message.content = message.content || '_页面刷新，运行已中断。_';
              if (message.process) {
                message.process.finishedAt = message.process.finishedAt || now();
                (message.process.steps || []).forEach(item => {
                  if (item.status === 'running') item.status = 'stopped';
                });
              }
            });
          });
          if (this.sessions.length) this.persist();
        }

        persist() {
          const payload = JSON.stringify({ version: 3, activeId: this.activeId, sessions: this.sessions });
          if (!storage.write(payload)) {
            this.toast('本地存储不可用，本次修改只保存在内存');
          }
        }

        bind() {
          $('#new-session').addEventListener('click', () => this.newSession());
          $('#open-settings').addEventListener('click', () => this.openSettings());
          $('#session-search').addEventListener('input', () => this.renderSidebar());
          $('#session-search').addEventListener('keydown', event => {
            if (event.key === 'Escape') {
              this.els.sessionSearch.value = '';
              this.renderSidebar();
              this.focusPrompt();
            }
          });

          this.els.sessionList.addEventListener('click', event => {
            const deleteButton = event.target.closest('[data-delete-session]');
            if (deleteButton) {
              event.stopPropagation();
              this.deleteSession(deleteButton.getAttribute('data-delete-session'));
              return;
            }
            const row = event.target.closest('[data-session-id]');
            if (row) this.selectSession(row.getAttribute('data-session-id'));
          });
          this.els.sessionList.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            if (event.target.closest('[data-delete-session]')) return;
            const row = event.target.closest('[data-session-id]');
            if (!row) return;
            event.preventDefault();
            this.selectSession(row.getAttribute('data-session-id'));
          });

          $$('.nav-item').forEach(button => {
            button.addEventListener('click', () => this.handleNav(button.getAttribute('data-nav')));
          });

          this.els.transcript.addEventListener('click', event => {
            const select = event.target.closest('[data-select-msg]');
            if (select) {
              this.selectedMessageId = select.getAttribute('data-select-msg');
              this.openInspector();
              this.renderInspector();
              return;
            }
            const copy = event.target.closest('[data-copy]');
            if (copy) {
              const message = this.activeSession() && this.activeSession().messages.find(item => item.id === copy.getAttribute('data-copy'));
              if (message) this.copyText(message.content);
              return;
            }
            const prompt = event.target.closest('[data-suggest]');
            if (prompt) {
              this.submit(prompt.getAttribute('data-suggest'));
            }
          });

          this.els.transcript.addEventListener('scroll', () => {
            const el = this.els.transcript;
            this.pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
            this.els.jump.hidden = this.pinned;
          });

          this.els.jump.addEventListener('click', () => this.scrollToBottom(true));

          this.els.prompt.addEventListener('input', () => {
            this.autoResize();
            this.updateSendState();
            this.handlePaletteInput();
          });
          this.els.prompt.addEventListener('keydown', event => this.handlePromptKey(event));
          this.els.send.addEventListener('click', () => this.submit(this.els.prompt.value));
          this.els.stop.addEventListener('click', () => this.stopRun());
          this.els.composer.addEventListener('click', () => {
            if (!this.busy) this.els.prompt.focus();
          });

          this.els.paletteItems.addEventListener('mousedown', event => {
            const item = event.target.closest('[data-palette-value]');
            if (!item) return;
            event.preventDefault();
            this.choosePaletteItem(Number(item.getAttribute('data-index')));
          });
          document.addEventListener('mousedown', event => {
            if (this.els.palette.hidden) return;
            if (this.els.palette.contains(event.target) || this.els.composer.contains(event.target)) return;
            this.closePalette();
          });

          this.els.inspectorBody.addEventListener('click', event => {
            const tab = event.target.closest('[data-open-tab]');
            if (tab) {
              this.inspectorTab = tab.getAttribute('data-open-tab');
              this.renderInspector();
              return;
            }            const quote = event.target.closest('[data-quote]');
            if (quote) {
              const text = quote.getAttribute('data-quote');
              this.els.prompt.value = '参考知识：' + text + '\n\n';
              this.autoResize();
              this.updateSendState();
              this.focusPrompt();
              this.toast('已引用到输入框');
              return;
            }
            const quoteStep = event.target.closest('[data-select-msg-step]');
            if (quoteStep) {
              this.selectedMessageId = quoteStep.getAttribute('data-select-msg-step');
              this.renderInspector();
            }
          });

          $('#toggle-sidebar').addEventListener('click', () => this.toggleSidebar(true));
          $('#toggle-inspector').addEventListener('click', () => this.toggleInspector(true));
          $('#close-inspector').addEventListener('click', () => this.toggleInspector(false));
          $$('.tab', this.els.inspector).forEach(tab => {
            tab.addEventListener('click', () => {
              this.inspectorTab = tab.getAttribute('data-tab');
              this.renderInspector();
            });
          });
          this.els.scrim.addEventListener('click', () => {
            this.toggleSidebar(false);
            this.toggleInspector(false);
          });

          $('#modal-close').addEventListener('click', () => this.closeModal());
          this.els.modal.addEventListener('click', event => {
            if (event.target === this.els.modal) this.closeModal();
          });
          this.els.modalBody.addEventListener('click', event => this.handleModalAction(event));
          this.els.modalFoot.addEventListener('click', event => this.handleModalAction(event));

          document.addEventListener('keydown', event => this.handleGlobalKey(event));
        }

        handleGlobalKey(event) {
          const meta = event.metaKey || event.ctrlKey;
          if (meta && event.key.toLowerCase() === 'k') {
            event.preventDefault();
            this.toggleSidebar(true);
            this.els.sessionSearch.focus();
            this.els.sessionSearch.select();
            return;
          }
          if (meta && event.key.toLowerCase() === 'n') {
            event.preventDefault();
            this.newSession();
            return;
          }
          if (event.key === 'Escape') {
            if (!this.els.palette.hidden) {
              this.closePalette();
              event.preventDefault();
              return;
            }
            if (!this.els.modal.hidden) {
              this.closeModal();
              event.preventDefault();
              return;
            }
            if (this.els.inspector.classList.contains('open')) {
              this.toggleInspector(false);
            } else if (this.els.sidebar.classList.contains('open')) {
              this.toggleSidebar(false);
            }
          }
        }

        handleNav(nav) {
          if (nav === 'knowledge') {
            this.inspectorTab = 'knowledge';
            this.openInspector();
            this.renderInspector();
            this.toast('已打开当前会话的知识');
            this.toggleSidebar(false);
            return;
          }
          if (nav === 'settings') {
            this.openSettings();
            return;
          }
          this.toggleSidebar(window.innerWidth <= 820 ? false : true);
          if (window.innerWidth > 820) this.els.sessionSearch.focus();
        }

        handlePromptKey(event) {
          if (!this.els.palette.hidden) {
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
              event.preventDefault();
              const delta = event.key === 'ArrowDown' ? 1 : -1;
              this.paletteIndex = (this.paletteIndex + delta + this.paletteMatches.length) % Math.max(1, this.paletteMatches.length);
              this.renderPalette();
              return;
            }
            if (event.key === 'Enter') {
              event.preventDefault();
              this.choosePaletteItem(this.paletteIndex);
              return;
            }
            if (event.key === 'Escape') {
              event.preventDefault();
              this.closePalette();
              return;
            }
          }
          if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            this.submit(this.els.prompt.value);
          }
        }

        autoResize() {
          const el = this.els.prompt;
          el.style.height = 'auto';
          el.style.height = Math.min(150, Math.max(38, el.scrollHeight)) + 'px';
        }

        updateSendState() {
          const hasText = this.els.prompt.value.trim().length > 0;
          this.els.send.disabled = this.busy || !hasText;
        }

        focusPrompt() {
          if (!this.busy) this.els.prompt.focus();
        }

        setBusy(busy) {
          this.busy = busy;
          this.els.composer.classList.toggle('busy', busy);
          this.els.stop.hidden = !busy;
          this.els.send.hidden = busy;
          this.updateSendState();
          if (busy) {
            this.els.prompt.setAttribute('aria-busy', 'true');
          } else {
            this.els.prompt.removeAttribute('aria-busy');
          }
          this.els.status.className = 'status' + (busy ? ' working' : '');
          this.els.status.innerHTML = '<i></i><span>' + (busy ? 'working' : 'ready') + '</span>';
          if (!busy) {
            const assistants = this.activeSession() ? this.activeSession().messages.filter(message => message.role === 'assistant') : [];
            const lastAssistant = assistants[assistants.length - 1];
            const hasStopped = lastAssistant && lastAssistant.status === 'stopped';
            this.els.status.className = 'status' + (hasStopped ? ' stopped' : '');
            this.els.status.innerHTML = '<i></i><span>' + (hasStopped ? 'stopped' : 'ready') + '</span>';
          }
          if (!busy) this.focusPrompt();
        }

        newSession() {
          if (this.busy) this.stopRun(true);
          const session = {
            id: uid('ses'),
            title: '新会话',
            createdAt: now(),
            updatedAt: now(),
            model: 'deepseek-chat',
            messages: []
          };
          this.sessions.unshift(session);
          this.sessions = this.sessions.slice(0, MAX_SESSIONS);
          this.activeId = session.id;
          this.selectedMessageId = null;
          this.attachments = [];
          this.pinned = true;
          this.persist();
          this.renderAll();
          this.toggleSidebar(false);
          this.focusPrompt();
          this.toast('已创建新会话');
        }

        selectSession(id) {
          if (id === this.activeId) {
            this.toggleSidebar(false);
            return;
          }
          if (this.busy) this.stopRun(true);
          this.activeId = id;
          this.selectedMessageId = this.lastAssistantId(this.sessionById(id));
          this.attachments = [];
          this.pinned = true;
          this.persist();
          this.renderAll();
          this.toggleSidebar(false);
        }

        deleteSession(id) {
          const session = this.sessionById(id);
          if (!session) return;
          const label = session.title || '这个会话';
          if (!window.confirm('删除「' + label + '」？此操作只影响本地浏览器历史。')) return;
          if (this.activeId === id && this.busy) this.stopRun(true);
          this.sessions = this.sessions.filter(item => item.id !== id);
          if (this.activeId === id) {
            const next = this.sessions[0] || null;
            if (next) {
              this.activeId = next.id;
              this.selectedMessageId = this.lastAssistantId(next);
            } else {
              this.activeId = null;
              this.selectedMessageId = null;
            }
          }
          if (!this.sessions.length) {
            const fresh = { id: uid('ses'), title: '新会话', createdAt: now(), updatedAt: now(), model: 'deepseek-chat', messages: [] };
            this.sessions = [fresh];
            this.activeId = fresh.id;
          }
          this.persist();
          this.renderAll();
          this.toast('已删除会话');
        }

        submit(rawText) {
          const text = String(rawText || '').trim();
          if (!text || this.busy) return;
          const session = this.activeSession();
          if (!session) return;

          if (!session.messages.length || session.title === '新会话') {
            session.title = titleFromMessage(text);
          }
          const user = {
            id: uid('msg'),
            role: 'user',
            content: text,
            time: now(),
            attachments: this.attachments.slice()
          };
          const assistant = {
            id: uid('msg'),
            role: 'assistant',
            content: '',
            time: now(),
            status: 'running',
            tokens: { input: 0, output: 0 },
            process: {
              startedAt: now(),
              finishedAt: null,
              steps: [],
              files: [],
              knowledge: []
            }
          };
          session.messages.push(user, assistant);
          session.updatedAt = now();
          this.activeId = session.id;
          this.selectedMessageId = assistant.id;
          this.attachments = [];
          this.pinned = true;
          this.persist();
          this.renderAll();
          this.setBusy(true);
          this.els.prompt.value = '';
          this.autoResize();
          this.updateSendState();
          const scenario = buildScenario(text, user.attachments || []);
          this.runAssistant(session, assistant, scenario, ++this.runToken);
        }

        async runAssistant(session, assistant, scenario, token) {
          assistant.process.files = Array.from(new Set(scenario.files || []));
          assistant.process.knowledge = scenario.knowledge || [];
          const steps = (scenario.steps || []).filter(item => item.kind !== 'answer');
          try {
            for (const rawStep of steps) {
              if (!this.isActiveRun(token, session)) return;
              const liveStep = Object.assign({}, rawStep, {
                id: rawStep.id || uid('step'),
                status: 'running',
                startedAt: now()
              });
              assistant.process.steps.push(liveStep);
              this.refreshAssistant(assistant, session);
              this.scrollToBottomIfPinned();
              await sleep(460 + Math.random() * 360);
              if (!this.isActiveRun(token, session)) {
                liveStep.status = 'stopped';
                return;
              }
              liveStep.status = 'done';
              liveStep.duration = now() - liveStep.startedAt;
              this.refreshAssistant(assistant, session);
            }

            if (!this.isActiveRun(token, session)) return;
            const answerStep = Object.assign({}, step('answer', '生成回复', '基于已收集的证据给出最终答案。', '', 0), {
              status: 'running',
              startedAt: now()
            });
            assistant.process.steps.push(answerStep);
            this.refreshAssistant(assistant, session);
            const answer = scenario.answer || '';
            const chunks = splitChunks(answer, 5);
            for (const chunk of chunks) {
              if (!this.isActiveRun(token, session)) {
                answerStep.status = 'stopped';
                return;
              }
              assistant.content += chunk;
              this.updateAssistantCopy(assistant);
              await sleep(14);
            }
            answerStep.status = 'done';
            answerStep.duration = now() - answerStep.startedAt;
            assistant.status = 'done';
            assistant.tokens = {
              input: estimateTokens(textOf(session.messages.slice(-6))),
              output: estimateTokens(assistant.content)
            };
            assistant.process.finishedAt = now();
            session.updatedAt = now();
            this.persist();
            this.refreshAssistant(assistant, session);
            this.setBusy(false);
          } catch (error) {
            assistant.status = 'stopped';
            assistant.content += (assistant.content ? '\n\n' : '') + '_运行出错：' + (error && error.message ? error.message : String(error)) + '_';
            assistant.process.finishedAt = now();
            this.persist();
            this.refreshAssistant(assistant, session);
            this.setBusy(false);
            this.toast('运行出错，已停止');
          }
        }

        isActiveRun(token, session) {
          return token === this.runToken && this.activeId === session.id;
        }

        stopRun(silent) {
          if (!this.busy) return;
          this.runToken += 1;
          const session = this.activeSession();
          if (session) {
            const assistant = session.messages.slice().reverse().find(message => message.role === 'assistant' && message.status === 'running');
            if (assistant) {
              assistant.status = 'stopped';
              const runningStep = assistant.process.steps.slice().reverse().find(item => item.status === 'running');
              if (runningStep) runningStep.status = 'stopped';
              if (!assistant.content) assistant.content = '_已停止，未生成完整回复。_';
              else assistant.content += '\n\n_（已停止）_';
              assistant.process.finishedAt = now();
              session.updatedAt = now();
            }
          }
          this.persist();
          this.setBusy(false);
          this.renderAll();
          if (!silent) this.toast('已停止本轮运行');
        }

        refreshAssistant(assistant, session) {
          if (this.activeId !== session.id) return;
          const article = this.els.transcript.querySelector('[data-message-id="' + assistant.id + '"]');
          if (article) {
            article.innerHTML = this.assistantInner(assistant);
          } else {
            this.renderTranscript();
          }
          this.renderInspector();
          this.renderSidebar();
          this.scrollToBottomIfPinned();
          this.updateContextMeter();
        }

        updateAssistantCopy(assistant) {
          const article = this.els.transcript.querySelector('[data-message-id="' + assistant.id + '"]');
          if (!article) {
            this.renderTranscript();
            return;
          }
          const copy = article.querySelector('.assistant-copy');
          if (copy) {
            copy.innerHTML = renderMarkdown(assistant.content) + '<span class="stream-cursor" aria-hidden="true"></span>';
          }
          this.scrollToBottomIfPinned();
        }

        copyText(text) {
          const value = String(text || '');
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(value).then(() => this.toast('已复制回复'), () => this.fallbackCopy(value));
          } else {
            this.fallbackCopy(value);
          }
        }

        fallbackCopy(value) {
          const area = document.createElement('textarea');
          area.value = value;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          try { document.execCommand('copy'); this.toast('已复制回复'); }
          catch (error) { this.toast('复制失败'); }
          document.body.removeChild(area);
        }

        scrollToBottom(force) {
          if (!force && !this.pinned) return;
          const el = this.els.transcript;
          el.scrollTop = el.scrollHeight;
          this.pinned = true;
          this.els.jump.hidden = true;
        }

        scrollToBottomIfPinned() {
          this.scrollToBottom(false);
        }

        renderAll() {
          this.renderSidebar();
          this.renderTranscript();
          this.renderInspector();
          this.renderHeader();
          this.renderSuggestions();
          this.renderAttachments();
          this.updateContextMeter();
        }

        renderHeader() {
          const session = this.activeSession();
          const assistants = session ? session.messages.filter(message => message.role === 'assistant') : [];
          const lastAssistant = assistants[assistants.length - 1];
          const stopped = !this.busy && lastAssistant && lastAssistant.status === 'stopped';
          const state = this.busy ? 'working' : (stopped ? 'stopped' : 'ready');
          this.els.crumb.textContent = session ? session.title : '新会话';
          this.els.inspectorTitle.textContent = session ? (session.title || '过程') : '过程';
          this.els.sessionStat.textContent = session ? session.messages.length + ' messages' : '0 messages';
          this.els.status.className = 'status' + (state === 'working' ? ' working' : (state === 'stopped' ? ' stopped' : ''));
          this.els.status.innerHTML = '<i></i><span>' + state + '</span>';
        }

        renderSidebar() {
          const query = this.els.sessionSearch.value.trim().toLowerCase();
          const filtered = this.sessions
            .slice()
            .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
            .filter(session => !query || (session.title || '').toLowerCase().includes(query) || (session.messages || []).some(message => String(message.content || '').toLowerCase().includes(query)));

          this.els.sessionCount.textContent = String(this.sessions.length);
          const knowledgeTotal = this.sessions.reduce((total, session) => total + session.messages.reduce((sum, message) => sum + ((message.process && message.process.knowledge) ? message.process.knowledge.length : 0), 0), 0);
          this.els.knowledgeCount.textContent = String(knowledgeTotal);

          if (!filtered.length) {
            this.els.sessionList.innerHTML = '<div class="empty-panel"><span class="mark">⌕</span>没有匹配的会话</div>';
            return;
          }

          const groups = new Map();
          filtered.forEach(session => {
            const key = dayKey(session.updatedAt || session.createdAt || now());
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(session);
          });

          let html = '';
          groups.forEach((sessions, key) => {
            html += '<div class="session-group"><div class="session-group-label">' + dayLabel(sessions[0].updatedAt || sessions[0].createdAt) + '</div>';
            sessions.forEach(session => {
              const active = session.id === this.activeId;
              const count = session.messages.length;
              html += '<div class="session-row ' + (active ? 'active' : '') + '" data-session-id="' + session.id + '" role="button" tabindex="0">' +
                '<span class="session-ico">◫</span>' +
                '<span class="session-main"><span class="session-title">' + escapeHtml(session.title || '新会话') + '</span>' +
                '<span class="session-sub">' + count + ' 条消息 · ' + relativeTime(session.updatedAt || session.createdAt) + '</span></span>' +
                '<button class="session-del" data-delete-session="' + session.id + '" title="删除会话" aria-label="删除会话">×</button>' +
                '</div>';
            });
            html += '</div>';
          });
          this.els.sessionList.innerHTML = html;
        }

        renderTranscript() {
          const session = this.activeSession();
          if (!session) {
            this.els.transcript.innerHTML = '<div class="stream"><div class="empty"><div class="empty-mark">✳</div><h1>从一句话开始</h1><p>Atlas 会先读代码、再改代码、最后用测试证明结果。</p></div></div>';
            return;
          }
          if (!session.messages.length) {
            this.els.transcript.innerHTML = '<div class="stream"><div class="empty">' +
              '<div class="empty-mark">✳</div>' +
              '<h1>今天想做什么？</h1>' +
              '<p>描述一个任务，Atlas 会展示完整的工具调用、文件修改和验证过程。也可以用 <code>/</code> 打开命令，<code>#</code> 引用文件。</p>' +
              '<div class="suggest-grid">' +
              '<button class="suggest" data-suggest="解释这个项目的架构"><b>解释项目架构</b><span>one knowledge store / journal / execution</span></button>' +
              '<button class="suggest" data-suggest="检查 TUI 的布局问题并修复"><b>检查 TUI 布局</b><span>streaming / session / attachments</span></button>' +
              '<button class="suggest" data-suggest="修复一个失败的测试"><b>修复失败测试</b><span>test-first / evidence / verify</span></button>' +
              '</div></div></div>';
            return;
          }

          let html = '<div class="stream">';
          let lastDay = null;
          session.messages.forEach(message => {
            const day = dayKey(message.time || session.createdAt || now());
            if (day !== lastDay) {
              html += '<div class="day-divider">' + dayLabel(message.time || session.createdAt) + '</div>';
              lastDay = day;
            }
            html += this.messageInner(message);
          });
          html += '</div>';
          this.els.transcript.innerHTML = html;
          if (this.pinned) this.scrollToBottom(true);
        }

        messageInner(message) {
          if (message.role === 'user') return this.userInner(message);
          if (message.role === 'system') return '<div class="system-note">' + escapeHtml(message.content) + '</div>';
          return this.assistantArticle(message);
        }

        userInner(message) {
          const attachments = (message.attachments || []).length
            ? '<div class="attachments">' + message.attachments.map(path => '<span class="attachment">⌁ ' + escapeHtml(path) + '</span>').join('') + '</div>'
            : '';
          return '<article class="message" data-message-id="' + message.id + '">' +
            '<div class="msg-label"><span class="name">You</span><span class="time">' + formatTime(message.time) + '</span></div>' +
            '<div class="user-bubble">' + escapeHtml(message.content) + attachments + '</div>' +
            '</article>';
        }

        assistantArticle(message) {
          return '<article class="message" data-message-id="' + message.id + '">' + this.assistantInner(message) + '</article>';
        }

        assistantInner(message) {
          const status = message.status || 'done';
          const steps = (message.process && message.process.steps) || [];
          const running = status === 'running';
          const content = message.content
            ? '<div class="assistant-copy prose">' + renderMarkdown(message.content) + (running ? '<span class="stream-cursor" aria-hidden="true"></span>' : '') + '</div>'
            : (running ? '<div class="thinking"><span>正在执行</span><span class="dots"><i></i><i></i><i></i></span></div>' : '');
          const processBar = steps.length ? this.processBar(message) : '';
          const inlineSteps = steps.length ? '<div class="inline-steps">' + steps.slice(0, 6).map(item => {
            return '<span class="step-chip ' + (item.status || 'done') + '">' + this.stepIcon(item.kind) + ' ' + escapeHtml(this.stepLabel(item)) + '</span>';
          }).join('') + (steps.length > 6 ? '<span class="step-chip">+' + (steps.length - 6) + '</span>' : '') + '</div>' : '';
          const tokens = message.tokens || { input: 0, output: estimateTokens(message.content) };
          const total = (tokens.input || 0) + (tokens.output || 0);
          return '<div class="msg-label assistant-label"><span class="brand-mark">✳</span><span class="name">Atlas</span>' +
            '<span class="msg-status ' + status + '">' + status + '</span><span class="time">' + formatTime(message.time) + '</span></div>' +
            content + processBar + inlineSteps +
            '<div class="msg-foot"><span>deepseek-chat</span><span>·</span><span>' + total + ' tokens</span>' +
            '<button class="copy" data-copy="' + message.id + '">copy</button></div>';
        }

        processBar(message) {
          const process = message.process || { steps: [] };
          const steps = process.steps || [];
          const running = message.status === 'running';
          const duration = (process.finishedAt || now()) - (process.startedAt || now());
          const status = message.status || 'done';
          return '<button class="process-bar" data-select-msg="' + message.id + '">' +
            '<span class="p-ico ' + (running ? 'spin' : '') + '">' + (running ? '◌' : '◷') + '</span>' +
            '<span>Process</span><span class="p-meta">' + steps.length + ' steps · ' + formatDuration(duration) + '</span>' +
            '<span class="status-pill ' + status + '">' + status + '</span>' +
            '<span class="p-chev">›</span></button>';
        }

        renderInspector() {
          const session = this.activeSession();
          const message = this.selectedMessage();
          if (!session) {
            this.els.inspectorBody.innerHTML = '<div class="empty-panel"><span class="mark">▤</span>没有可展示的运行</div>';
            return;
          }
          if (!message || message.role !== 'assistant') {
            this.els.inspectorBody.innerHTML = '<div class="empty-panel"><span class="mark">▤</span>选择一个回复，查看它的执行过程。<br>点击回复下方的 Process 条即可。</div>' +
              '<button class="btn" style="margin-top:10px" data-select-msg-step="' + (this.lastAssistantId(session) || '') + '">打开最近一次运行</button>';
            return;
          }
          this.els.inspectorTitle.textContent = session.title || '过程';
          if (this.inspectorTab === 'context') {
            this.els.inspectorBody.innerHTML = this.contextPanel(session, message);
          } else if (this.inspectorTab === 'knowledge') {
            this.els.inspectorBody.innerHTML = this.knowledgePanel(message);
          } else {
            this.els.inspectorBody.innerHTML = this.processPanel(message);
          }
          $$('.tab', this.els.inspector).forEach(tab => {
            tab.classList.toggle('active', tab.getAttribute('data-tab') === this.inspectorTab);
          });
        }

        processPanel(message) {
          const process = message.process || { steps: [], files: [] };
          const steps = process.steps || [];
          const duration = (process.finishedAt || now()) - (process.startedAt || now());
          const toolSteps = steps.filter(item => item.kind !== 'plan' && item.kind !== 'answer');
          const status = message.status || 'done';
          let html = '<div class="detail-meta"><span class="status-pill ' + status + '">' + status + '</span>' +
            '<span>' + formatTime(message.time) + '</span><span>·</span><span>' + formatDuration(duration) + '</span></div>' +
            '<div class="detail-stats">' +
            '<div class="detail-stat"><b>' + steps.length + '</b><span>steps</span></div>' +
            '<div class="detail-stat"><b>' + toolSteps.length + '</b><span>tool calls</span></div>' +
            '<div class="detail-stat"><b>' + ((process.files || []).length) + '</b><span>files</span></div>' +
            '</div>';
          if (!steps.length) {
            html += '<div class="empty-panel"><span class="mark">◌</span>正在等待第一个步骤...</div>';
            return html;
          }
          html += '<div class="timeline">';
          steps.forEach((item, index) => {
            const open = item.status === 'running' || item.kind === 'plan' || item.kind === 'answer' || item.kind === 'edit' || (index === steps.length - 1);
            html += '<details class="detail-step ' + (item.status || 'done') + '"' + (open ? ' open' : '') + '>' +
              '<summary>' +
              '<span class="step-index">' + String(index + 1).padStart(2, '0') + '</span>' +
              '<span class="step-icon">' + (item.status === 'running' ? '◌' : this.stepIcon(item.kind)) + '</span>' +
              '<span class="step-title">' + escapeHtml(this.stepLabel(item)) + (item.arg ? ' <code>' + escapeHtml(item.arg) + '</code>' : '') + '</span>' +
              '<span class="step-meta">' + (item.status === 'running' ? 'running' : (item.status === 'stopped' ? 'stopped' : formatDuration(item.duration))) + '</span>' +
              '<span class="chev">›</span></summary>' +
              '<div class="step-content">' +
              (item.detail ? '<p>' + escapeHtml(item.detail) + '</p>' : '') +
              (item.diff ? this.renderDiff(item.diff) : '') +
              (item.output ? '<pre class="output">' + escapeHtml(item.output) + '</pre>' : '') +
              '</div></details>';
          });
          html += '</div>';
          if (process.files && process.files.length) {
            html += '<div class="card"><h4>本轮文件</h4><div class="file-list">' +
              process.files.map(path => '<div class="file-row"><span class="file-ico">⌁</span>' + escapeHtml(path) + '</div>').join('') +
              '</div></div>';
          }
          return html;
        }

        contextPanel(session, message) {
          const messages = session.messages || [];
          const process = message.process || {};
          const steps = process.steps || [];
          const checks = steps.filter(item => item.kind === 'check');
          const percent = Math.min(94, 18 + messages.length * 6);
          const inputTokens = (message.tokens && message.tokens.input) || estimateTokens(textOf(messages.slice(-6)));
          const outputTokens = (message.tokens && message.tokens.output) || estimateTokens(message.content);
          return '<div class="detail-meta"><span class="status-pill done">session</span><span>' + (session.id || '').slice(0, 12) + '</span></div>' +
            '<div class="detail-stats">' +
            '<div class="detail-stat"><b>' + messages.length + '</b><span>messages</span></div>' +
            '<div class="detail-stat"><b>' + inputTokens + '</b><span>input</span></div>' +
            '<div class="detail-stat"><b>' + outputTokens + '</b><span>output</span></div>' +
            '</div>' +
            '<div class="card"><h4>运行时</h4><div class="detail-meta"><span>' + escapeHtml(session.model || 'deepseek-chat') + '</span><span>·</span><span>local demo</span></div>' +
            '<p>上下文占用约 ' + percent + '%，剩余空间足够继续；超过阈值时会生成压缩摘要。</p>' +
            '<div class="context-meter" style="width:100%;margin-top:8px"><span style="width:' + percent + '%"></span></div></div>' +
            '<div class="card"><h4>本轮验证</h4>' +
            (checks.length ? checks.map(item => '<div class="file-row"><span class="file-ico">✓</span>' + escapeHtml(item.arg || item.title) + ' · ' + escapeHtml(item.output || 'passed') + '</div>').join('') : '<p>还没有运行 check。</p>') +
            '</div>' +
            '<div class="card"><h4>系统提示</h4><p>Project: coze<br>Permission: accept_edits<br>Test: python -m pytest -q<br>Mode: interactive prototype</p></div>';
        }

        knowledgePanel(message) {
          const session = this.activeSession();
          const items = (message && message.process && message.process.knowledge) || [];
          const all = session ? session.messages.flatMap(item => (item.process && item.process.knowledge) || []) : [];
          const list = items.length ? items : all;
          if (!list.length) {
            return '<div class="empty-panel"><span class="mark">◈</span>当前会话还没有写入知识。<br>运行一次 Curator 或在对话中写入事实后会出现在这里。</div>';
          }
          return '<div class="detail-meta"><span class="status-pill done">knowledge</span><span>' + list.length + ' items recalled</span></div>' +
            list.map(item => '<div class="knowledge-card">' +
              '<div class="k-head"><span class="kind-pill">' + escapeHtml(item.kind || 'fact') + '</span><b>' + escapeHtml(item.title || '') + '</b></div>' +
              '<p>' + escapeHtml(item.body || '') + '</p>' +
              '<div class="k-foot"><span>confidence ' + Number(item.confidence || 0).toFixed(2) + '</span>' +
              '<button class="quote" data-quote="' + escapeHtml((item.title || '') + '：' + (item.body || '')) + '">引用</button></div>' +
              '</div>').join('');
        }

        renderDiff(diff) {
          const lines = String(diff || '').split('\n');
          return '<div class="diff">' + lines.map(line => {
            const cls = line.startsWith('+') ? 'add' : (line.startsWith('-') ? 'del' : 'ctx');
            return '<div class="' + cls + '">' + escapeHtml(line || ' ') + '</div>';
          }).join('') + '</div>';
        }

        stepIcon(kind) {
          return ({ plan: '◈', read: '▤', search: '⌕', edit: '✎', check: '⚡', answer: '✳', knowledge: '◉' })[kind] || '·';
        }

        stepLabel(item) {
          if (item.kind === 'read') return 'read';
          if (item.kind === 'search') return 'search';
          if (item.kind === 'edit') return 'edit';
          if (item.kind === 'check') return 'check';
          if (item.kind === 'plan') return 'plan';
          if (item.kind === 'answer') return 'answer';
          if (item.kind === 'knowledge') return 'knowledge';
          return item.title || item.kind || 'step';
        }

        renderSuggestions() {
          const session = this.activeSession();
          const show = session ? session.messages.length === 0 : true;
          this.els.suggestions.style.display = show ? 'flex' : 'none';
        }

        renderAttachments() {
          this.els.attachmentList.innerHTML = this.attachments.map((path, index) =>
            '<span class="attachment-chip">⌁ ' + escapeHtml(path) + '<button data-remove-attachment="' + index + '" aria-label="移除附件">×</button></span>'
          ).join('');
          $$('[data-remove-attachment]', this.els.attachmentList).forEach(button => {
            button.addEventListener('click', () => {
              this.attachments.splice(Number(button.getAttribute('data-remove-attachment')), 1);
              this.renderAttachments();
              this.focusPrompt();
            });
          });
        }

        updateContextMeter() {
          const session = this.activeSession();
          const percent = session ? Math.min(94, 18 + session.messages.length * 6) : 18;
          this.els.contextMeter.style.width = percent + '%';
          this.els.sessionStat.textContent = session ? session.messages.length + ' messages' : '0 messages';
        }

        toggleSidebar(open) {
          if (window.innerWidth > 820) {
            this.els.sidebar.classList.remove('open');
            this.els.scrim.hidden = true;
            return;
          }
          this.els.sidebar.classList.toggle('open', open);
          this.els.scrim.hidden = !open && !this.els.inspector.classList.contains('open');
        }

        toggleInspector(open) {
          if (window.innerWidth > 1180) {
            this.els.inspector.classList.remove('open');
            return;
          }
          this.els.inspector.classList.toggle('open', open);
          this.els.scrim.hidden = !open && !this.els.sidebar.classList.contains('open');
          if (open) this.renderInspector();
        }

        openInspector() {
          this.toggleSidebar(false);
          if (window.innerWidth <= 1180) {
            this.els.inspector.classList.add('open');
            this.els.scrim.hidden = false;
          }
        }

        /* ------------------------------ palette ------------------------------ */

        handlePaletteInput() {
          const value = this.els.prompt.value;
          if (value.startsWith('/') && !value.includes(' ')) {
            this.openPalette('commands', value.slice(1));
            return;
          }
          const hash = value.lastIndexOf('#');
          if (hash >= 0 && (hash === 0 || /\s/.test(value[hash - 1]))) {
            const query = value.slice(hash + 1);
            if (!query.includes(' ')) {
              this.openPalette('files', query);
              return;
            }
          }
          this.closePalette();
        }

        openPalette(mode, query) {
          this.paletteMode = mode;
          this.paletteIndex = 0;
          this.els.palette.hidden = false;
          this.els.paletteTitle.textContent = mode === 'files' ? 'Files' : 'Commands';
          this.filterPalette(query || '');
        }

        filterPalette(query) {
          const q = String(query || '').toLowerCase();
          if (this.paletteMode === 'commands') {
            const commands = [
              { name: '/new', desc: '新建会话', key: 'Ctrl N' },
              { name: '/sessions', desc: '聚焦会话历史', key: '' },
              { name: '/compact', desc: '压缩上下文', key: '' },
              { name: '/know', desc: '查看当前知识', key: '' },
              { name: '/doctor', desc: '查看上下文与运行信息', key: '' },
              { name: '/clear', desc: '清空当前会话', key: '' },
              { name: '/help', desc: '快捷键与帮助', key: '' },
              { name: '/export', desc: '导出全部会话 JSON', key: '' }
            ];
            this.paletteMatches = commands.filter(item => !q || item.name.includes(q) || item.desc.toLowerCase().includes(q));
          } else {
            this.paletteMatches = [
              { name: 'src/atlas/agent.py', desc: 'agent loop / tools', key: '' },
              { name: 'src/atlas/tui.py', desc: 'Textual frontend', key: '' },
              { name: 'src/atlas/knowledge.py', desc: 'knowledge store', key: '' },
              { name: 'src/atlas/workspace.py', desc: 'path guard / tools', key: '' },
              { name: 'tests/test_safety.py', desc: 'security regressions', key: '' },
              { name: 'README.md', desc: 'project overview', key: '' }
            ].filter(item => !q || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q));
          }
          if (this.paletteIndex >= this.paletteMatches.length) this.paletteIndex = 0;
          this.renderPalette();
        }

        renderPalette() {
          if (!this.els.palette.hidden) this.els.palette.hidden = false;
          this.els.paletteItems.innerHTML = this.paletteMatches.map((item, index) => {
            const icon = this.paletteMode === 'files' ? '⌁' : '◈';
            return '<div class="palette-item ' + (index === this.paletteIndex ? 'selected' : '') + '" data-palette-value="' + escapeHtml(item.name) + '" data-index="' + index + '">' +
              '<span class="palette-icon">' + icon + '</span>' +
              '<span><span class="palette-name">' + escapeHtml(item.name) + '</span><div class="palette-desc">' + escapeHtml(item.desc) + '</div></span>' +
              '<span class="palette-key">' + escapeHtml(item.key || '') + '</span></div>';
          }).join('') || '<div class="palette-item"><span></span><span class="palette-desc">没有匹配项</span><span></span></div>';
        }

        choosePaletteItem(index) {
          const item = this.paletteMatches[index];
          if (!item) return;
          if (this.paletteMode === 'files') {
            this.addAttachment(item.name);
          } else {
            this.executeCommand(item.name);
          }
          this.closePalette();
          this.els.prompt.value = '';
          this.autoResize();
          this.updateSendState();
          this.focusPrompt();
        }

        closePalette() {
          this.paletteMode = null;
          this.paletteMatches = [];
          this.paletteIndex = 0;
          this.els.palette.hidden = true;
        }

        addAttachment(path) {
          if (!this.attachments.includes(path)) this.attachments.push(path);
          this.renderAttachments();
          this.toast('已附加 ' + path);
        }

        executeCommand(command) {
          const name = command.replace(/^\//, '');
          if (name === 'new') return this.newSession();
          if (name === 'sessions') {
            this.toggleSidebar(true);
            this.els.sessionSearch.focus();
            return;
          }
          if (name === 'compact') return this.compactSession();
          if (name === 'know') {
            this.inspectorTab = 'knowledge';
            if (!this.selectedMessageId) this.selectedMessageId = this.lastAssistantId(this.activeSession());
            this.openInspector();
            this.renderInspector();
            return this.toast('已打开知识面板');
          }
          if (name === 'doctor') {
            this.inspectorTab = 'context';
            this.openInspector();
            this.renderInspector();
            return this.toast('已打开上下文信息');
          }
          if (name === 'clear') return this.clearSession();
          if (name === 'help') return this.openHelp();
          if (name === 'export') return this.exportSessions();
          this.toast('未知命令：/' + name);
        }

        compactSession() {
          const session = this.activeSession();
          if (!session) return;
          if (this.busy) return this.toast('当前运行结束后再压缩');
          const before = session.messages.length;
          if (before <= 4) return this.toast('消息太少，不需要压缩');
          const summary = '上下文已压缩：保留最近 4 条消息，旧消息合并为摘要。';
          session.messages = [
            { id: uid('msg'), role: 'system', content: summary, time: now() },
            ...session.messages.slice(-4)
          ];
          session.updatedAt = now();
          this.selectedMessageId = this.lastAssistantId(session);
          this.persist();
          this.renderAll();
          this.toast('已压缩 ' + before + ' → ' + session.messages.length + ' 条消息');
        }

        clearSession() {
          const session = this.activeSession();
          if (!session) return;
          if (this.busy) return this.toast('当前运行结束后再清空');
          if (!window.confirm('清空当前会话的全部消息？')) return;
          session.messages = [];
          session.title = '新会话';
          session.updatedAt = now();
          this.selectedMessageId = null;
          this.persist();
          this.renderAll();
          this.toast('已清空当前会话');
        }

        openSettings() {
          const counts = this.sessions.reduce((total, session) => total + session.messages.length, 0);
          this.els.modalEyebrow.textContent = 'ATLAS';
          this.els.modalTitle.textContent = '设置';
          this.els.modalBody.innerHTML =
            '<div class="row"><span>模型</span><b>deepseek-chat</b></div>' +
            '<div class="row"><span>运行模式</span><b>interactive prototype</b></div>' +
            '<div class="row"><span>会话数</span><b>' + this.sessions.length + '</b></div>' +
            '<div class="row"><span>消息数</span><b>' + counts + '</b></div>' +
            '<div class="row"><span>存储</span><b>localStorage · 本机</b></div>' +
            '<p style="margin-top:14px">这个页面是交互原型：对话内容由本地 scenario 生成，不会把你的工作区发送到远端模型。要接入真实 Atlas daemon，需要额外配置 endpoint 和 CORS。</p>';
          this.els.modalFoot.innerHTML = '<button class="btn danger" data-action="clear-all">清空全部历史</button><span class="spacer"></span><button class="btn" data-action="export">导出 JSON</button><button class="btn primary" data-action="close">完成</button>';
          this.els.modal.hidden = false;
        }

        openHelp() {
          this.els.modalEyebrow.textContent = 'KEYBOARD';
          this.els.modalTitle.textContent = '帮助';
          this.els.modalBody.innerHTML =
            '<div class="row"><span>发送消息</span><b><code>Enter</code></b></div>' +
            '<div class="row"><span>换行</span><b><code>Shift + Enter</code></b></div>' +
            '<div class="row"><span>新建会话</span><b><code>Ctrl/Cmd + N</code></b></div>' +
            '<div class="row"><span>搜索会话</span><b><code>Ctrl/Cmd + K</code></b></div>' +
            '<div class="row"><span>命令面板</span><b><code>/</code></b></div>' +
            '<div class="row"><span>引用文件</span><b><code>#</code></b></div>' +
            '<div class="row"><span>关闭面板</span><b><code>Esc</code></b></div>' +
            '<p style="margin-top:14px">点击回复下方的 <code>Process</code> 条，或右侧的步骤，可以查看完整工具调用、diff 和验证结果。</p>';
          this.els.modalFoot.innerHTML = '<span class="spacer"></span><button class="btn primary" data-action="close">知道了</button>';
          this.els.modal.hidden = false;
        }

        closeModal() {
          this.els.modal.hidden = true;
        }

        handleModalAction(event) {
          const action = event.target.closest('[data-action]');
          if (!action) return;
          const name = action.getAttribute('data-action');
          if (name === 'close') this.closeModal();
          if (name === 'export') this.exportSessions();
          if (name === 'clear-all') {
            if (!window.confirm('清空全部本地会话历史？')) return;
            if (this.busy) this.stopRun(true);
            storage.clear();
            const fresh = { id: uid('ses'), title: '新会话', createdAt: now(), updatedAt: now(), model: 'deepseek-chat', messages: [] };
            this.sessions = [fresh];
            this.activeId = fresh.id;
            this.selectedMessageId = null;
            this.persist();
            this.closeModal();
            this.renderAll();
            this.toast('已清空全部本地历史');
          }
        }

        exportSessions() {
          const payload = JSON.stringify({ version: 3, exportedAt: new Date().toISOString(), sessions: this.sessions }, null, 2);
          const blob = new Blob([payload], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'atlas-sessions-' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          this.toast('已导出会话 JSON');
        }

        toast(text) {
          this.els.toastText.textContent = text;
          this.els.toast.classList.add('show');
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => this.els.toast.classList.remove('show'), 2200);
        }
      }

      function splitChunks(text, size) {
        const chunks = [];
        let index = 0;
        while (index < text.length) {
          chunks.push(text.slice(index, index + size));
          index += size;
        }
        return chunks;
      }

      document.addEventListener('DOMContentLoaded', () => {
        window.atlasApp = new AtlasApp();
      });
    })();
  </script>
</body>
</html>
